<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>A Private Invitation</title>
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex">
<meta name="googlebot" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#C3B2AE">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Pinyon+Script&family=Cormorant+Garamond:wght@300;400&family=Marcellus&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;
    font-family:'Cormorant Garamond',Georgia,serif;color:#4A3F36;
    background:radial-gradient(70% 55% at 50% 40%,rgba(255,250,244,.5),transparent 70%),
      linear-gradient(160deg,#CFC0BC,#C3B2AE 48%,#B8A6A3)}
  .lock{width:min(92vw,360px);text-align:center;
    background:linear-gradient(172deg,#FBF3E7,#F4E5D4);border-radius:6px;
    padding:40px 26px 32px;box-shadow:0 30px 60px -26px rgba(72,52,46,.55);
    border:1px solid rgba(176,138,80,.3)}
  .mono{font-family:'Pinyon Script',cursive;font-size:2.5rem;color:#B08A50;line-height:1;margin:0 0 4px}
  .eyebrow{font-family:'Marcellus',serif;font-size:.6rem;letter-spacing:.34em;
    text-transform:uppercase;color:#8A7462;margin:0 0 22px}
  .rule{width:46px;height:1px;background:#DCC49A;margin:0 auto 22px}
  p.say{font-size:.98rem;font-weight:300;color:#6F5F51;margin:0 0 20px;line-height:1.55}
  input{width:100%;padding:13px 14px;font-family:'Marcellus',serif;font-size:.9rem;
    letter-spacing:.12em;text-align:center;color:#4A3F36;
    background:#FFFDF9;border:1px solid rgba(176,138,80,.45);border-radius:4px;outline:none}
  input:focus{border-color:#B08A50;box-shadow:0 0 0 3px rgba(176,138,80,.16)}
  button{width:100%;margin-top:12px;padding:13px;border:0;border-radius:4px;cursor:pointer;
    font-family:'Marcellus',serif;font-size:.68rem;letter-spacing:.3em;text-transform:uppercase;
    color:#FFF3EE;background:radial-gradient(circle at 34% 28%,#CE8A82,#B3374F 60%,#8C2A3E)}
  button:disabled{opacity:.6;cursor:wait}
  .msg{min-height:1.2em;margin:14px 0 0;font-size:.82rem;font-style:italic;color:#B3374F}
  .hint{margin:18px 0 0;font-size:.74rem;color:#9A8676;font-style:italic}
</style>
</head>
<body>
<div class="lock">
  <p class="mono">P &amp; R</p>
  <p class="eyebrow">A private invitation</p>
  <div class="rule"></div>
  <p class="say">This invitation is sealed. Please enter the passphrase we sent you to open it.</p>
  <input id="pw" type="password" inputmode="text" autocomplete="off"
         autocapitalize="characters" spellcheck="false" placeholder="PASSPHRASE" aria-label="Passphrase">
  <button id="go">Unseal</button>
  <p class="msg" id="msg" role="status"></p>
  <p class="hint">Nothing about the day is stored in this page unencrypted.</p>
</div>

const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const msg = document.getElementById('msg');
const pw  = document.getElementById('pw');
const go  = document.getElementById('go');

async function unseal(){
  const pass = pw.value.trim();
  if(!pass){ msg.textContent = 'Please enter the passphrase.'; return; }
  go.disabled = true; msg.textContent = 'Unsealing\u2026';
  try{
    const km = await crypto.subtle.importKey('raw', new TextEncoder().encode(pass),
                 'PBKDF2', false, ['deriveKey']);
    const key = await crypto.subtle.deriveKey(
      {name:'PBKDF2', salt:b64(D.s), iterations:D.n, hash:'SHA-256'},
      km, {name:'AES-GCM', length:256}, false, ['decrypt']);
    const packed = await crypto.subtle.decrypt({name:'AES-GCM', iv:b64(D.i)}, key, b64(D.c));

    /* gunzip: native stream where available, else a tiny inflate fallback */
    let html;
    if(typeof DecompressionStream === 'function'){
      const ds = new DecompressionStream('gzip');
      const stream = new Blob([packed]).stream().pipeThrough(ds);
      html = await new Response(stream).text();
    } else {
      const s = document.createElement('script');
      s.src = 'https://cdn.jsdelivr.net/npm/fflate@0.8.2/umd/index.js';
      await new Promise((res,rej)=>{ s.onload=res; s.onerror=rej; document.head.appendChild(s); });
      html = fflate.strFromU8(fflate.gunzipSync(new Uint8Array(packed)));
    }

    window.__K = key;
    document.open(); document.write(html); document.close();
  }catch(e){
    go.disabled = false;
    msg.textContent = 'That passphrase does not match. Please try again.';
    pw.select();
  }
}
go.addEventListener('click', unseal);
pw.addEventListener('keydown', e => { if(e.key === 'Enter') unseal(); });
pw.focus();
