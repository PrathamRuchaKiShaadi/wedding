const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const msg = document.getElementById('msg');
const pw  = document.getElementById('pw');
const go  = document.getElementById('go');

async function unseal(){
  const pass = pw.value.trim();
  if(!pass){ msg.textContent = 'Please enter the passphrase.'; return; }
  go.disabled = true; msg.textContent = 'Unsealing\u2026';
  try{
    const km = await crypto.subtle.importKey('raw', new TextEncoder().encode(pass),
                 'PBKDF2', false, ['deriveKey']);
    const key = await crypto.subtle.deriveKey(
      {name:'PBKDF2', salt:b64(D.s), iterations:D.n, hash:'SHA-256'},
      km, {name:'AES-GCM', length:256}, false, ['decrypt']);
    const packed = await crypto.subtle.decrypt({name:'AES-GCM', iv:b64(D.i)}, key, b64(D.c));

    /* gunzip: native stream where available, else a tiny inflate fallback */
    let html;
    if(typeof DecompressionStream === 'function'){
      const ds = new DecompressionStream('gzip');
      const stream = new Blob([packed]).stream().pipeThrough(ds);
      html = await new Response(stream).text();
    } else {
      const s = document.createElement('script');
      s.src = 'https://cdn.jsdelivr.net/npm/fflate@0.8.2/umd/index.js';
      await new Promise((res,rej)=>{ s.onload=res; s.onerror=rej; document.head.appendChild(s); });
      html = fflate.strFromU8(fflate.gunzipSync(new Uint8Array(packed)));
    }

    window.__K = key;
    document.open(); document.write(html); document.close();
  }catch(e){
    go.disabled = false;
    msg.textContent = 'That passphrase does not match. Please try again.';
    pw.select();
  }
